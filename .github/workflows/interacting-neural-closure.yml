name: Interacting learned higher-order memory closure benchmark (CPU)

on:
  push:
    paths:
      - "scripts/interacting_neural_closure_dataset.py"
      - "scripts/interacting_neural_closure_train.py"
      - "tests/test_neural_memory_closure.py"
      - ".github/workflows/interacting-neural-closure.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  learned-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical and CPU neural dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'qutip>=5.2,<6'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Check model feature definitions
        run: python -m pytest -q tests/test_neural_memory_closure.py tests/test_memory_feedback.py
      - name: Generate physically matched interacting HEOM parameter dataset
        run: |
          timeout --signal=TERM --kill-after=30s 600s python scripts/interacting_neural_closure_dataset.py
      - name: Train two neural objectives and compare held-out interpolation and extrapolation
        run: |
          timeout --signal=TERM --kill-after=30s 480s python scripts/interacting_neural_closure_train.py
      - name: Show held-out accuracy, baselines, and training cost
        if: success()
        run: cat outputs/neural_memory_closure/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interacting-learned-memory-closure
          path: |
            outputs/neural_memory_closure/
            outputs/neural_memory_dataset/
          retention-days: 30
          if-no-files-found: warn
      - name: Record run ID and status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 5 --body "Interacting learned closure: [run #${GITHUB_RUN_NUMBER}](${RUN_URL}); run ID \`${GITHUB_RUN_ID}\`; result **${RESULT}**; commit \`${GITHUB_SHA}\`."
