name: Interacting HEOM truncation error-backflow audit (CPU)

on:
  push:
    paths:
      - "src/nonmarkovian_neural_dynamics/hierarchy_defect.py"
      - "scripts/interacting_hierarchy_defect.py"
      - "tests/test_hierarchy_defect.py"
      - ".github/workflows/interacting-hierarchy-defect.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  hierarchy-defect:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ratio: "0.3"
            nk: 3
            depth: 3
            label: low-nk3
          - ratio: "0.3"
            nk: 7
            depth: 3
            label: low-nk7
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical HEOM dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'qutip>=5.2,<6'
      - name: Check exact defect identity and POD bounds
        run: python -m pytest -q tests/test_hierarchy_defect.py tests/test_dual_compression.py
      - name: Decompose actual interacting hierarchy truncation error
        run: |
          timeout --signal=TERM --kill-after=20s 420s python scripts/interacting_hierarchy_defect.py \
            --ratio ${{ matrix.ratio }} --nk ${{ matrix.nk }} --high-depth ${{ matrix.depth }} \
            --output outputs/interacting_defect/${{ matrix.label }}
      - name: Show initial-versus-backflow numerical decomposition
        if: success()
        run: cat outputs/interacting_defect/${{ matrix.label }}/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interacting-defect-${{ matrix.label }}
          path: outputs/interacting_defect/
          retention-days: 30
          if-no-files-found: warn
      - name: Report run ID
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 5 --body "Interacting hierarchy defect ${{ matrix.label }}: [run #${GITHUB_RUN_NUMBER}](${RUN_URL}); run ID \`${GITHUB_RUN_ID}\`; result **${RESULT}**; commit \`${GITHUB_SHA}\`."
