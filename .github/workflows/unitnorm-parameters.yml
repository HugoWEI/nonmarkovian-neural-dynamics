name: Hard-normalized PINN Hamiltonian robustness (CPU)

on:
  push:
    paths:
      - "scripts/unitnorm_parameter_robustness.py"
      - ".github/workflows/unitnorm-parameters.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  hardnorm-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify unit-norm physical state constraint
        run: python -m pytest -q tests/test_unitnorm.py
      - name: Test 48 networks across four Hamiltonians and two temperatures
        run: python scripts/unitnorm_parameter_robustness.py
      - name: Show accuracy and generality results
        if: success()
        run: cat outputs/unitnorm_parameters/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardnorm-Hamiltonian-robustness
          path: outputs/unitnorm_parameters/
          retention-days: 30
          if-no-files-found: warn
      - name: Report run ID
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 4 --body "Hard-norm parameter test: [run #${GITHUB_RUN_NUMBER}](${RUN_URL}); run ID \`${GITHUB_RUN_ID}\`; result **${RESULT}**; commit \`${GITHUB_SHA}\`."
