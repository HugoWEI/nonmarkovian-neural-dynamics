name: Piecewise Anderson PINN (CPU)

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/finite_anderson_piecewise.py"
      - "src/nonmarkovian_neural_dynamics/finite_anderson.py"
      - ".github/workflows/piecewise-anderson.yml"

permissions:
  contents: read

jobs:
  piecewise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical package
        run: python -m pip install -e '.[dev]'
      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify exact Hamiltonian
        run: python -m pytest -q tests/test_finite_anderson.py
      - name: Train piecewise PINN across temperatures
        run: python scripts/finite_anderson_piecewise.py --nwindows 5 --steps-per-window 600
      - name: Summary
        if: success()
        run: cat outputs/piecewise_anderson/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save trajectories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piecewise-anderson-benchmark
          path: outputs/piecewise_anderson/
          if-no-files-found: warn
          retention-days: 30
