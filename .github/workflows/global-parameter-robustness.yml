name: Global-adjoint Hamiltonian parameter robustness (CPU)

on:
  push:
    paths:
      - "scripts/global_parameter_robustness.py"
      - ".github/workflows/global-parameter-robustness.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  parameter-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run fixed Hamiltonian-parameter and initialization grid
        run: python scripts/global_parameter_robustness.py
      - name: Show parameter robustness report
        if: success()
        run: cat outputs/global_parameter_robustness/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-adjoint-parameter-grid
          path: outputs/global_parameter_robustness/
          retention-days: 30
          if-no-files-found: warn
      - name: Report run ID
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 4 --body "Parameter robustness: [run #${GITHUB_RUN_NUMBER}](${RUN_URL}); run ID \`${GITHUB_RUN_ID}\`; result **${RESULT}**; commit \`${GITHUB_SHA}\`."
