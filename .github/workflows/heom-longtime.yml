name: Source-order long-time HEOM depth study (CPU)

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/heom_longtime_comparison.py"
      - ".github/workflows/heom-longtime.yml"

permissions:
  contents: read
  issues: write

jobs:
  long-time:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ratio: "3.0"
            label: high
          - ratio: "0.3"
            label: low
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'qutip>=5.2,<6'
      - name: Compare source Nk at depths 2 and 3 through 6 ps
        run: |
          timeout --signal=TERM --kill-after=15s 300s python scripts/heom_longtime_comparison.py \
            --ratio ${{ matrix.ratio }} --horizon 6 \
            --output outputs/long_time/${{ matrix.label }}
      - name: Display convergence and positivity report
        if: success()
        run: cat outputs/long_time/${{ matrix.label }}/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heom-longtime-${{ matrix.label }}
          path: outputs/long_time/
          retention-days: 30
          if-no-files-found: warn
      - name: Report job ID
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 3 --body "HEOM long-time ${{ matrix.label }}: [run #${GITHUB_RUN_NUMBER}](${RUN_URL}); run ID \`${GITHUB_RUN_ID}\`; job result **${RESULT}**; commit \`${GITHUB_SHA}\`."
