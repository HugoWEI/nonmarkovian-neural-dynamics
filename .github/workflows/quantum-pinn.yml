name: Independent quantum PINN benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/quantum_pinn.py"
      - ".github/workflows/quantum-pinn.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  quantum-pinn:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numeric dependencies
        run: python -m pip install -e '.[dev]'
      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Validate physical reference and training smoke test
        run: python -m pytest -q tests/test_quantum_pinn.py
      - name: Train both PINNs on CPU
        run: python scripts/quantum_pinn.py --steps 2000
      - name: Summarize quantum benchmark
        if: success()
        run: cat outputs/quantum_pinn/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantum-pinn-benchmark
          path: outputs/quantum_pinn/
          if-no-files-found: warn
          retention-days: 30
