name: Correlated full-ADO HEOM voltage quench (CPU)

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/heom_correlated_quench.py"
      - ".github/workflows/heom-correlated-quench.yml"
      - "scripts/heom_convergence.py"

permissions:
  contents: read
  issues: write

jobs:
  correlated-quench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ratio: "3.0"
            nk: 3
            label: high
          - ratio: "0.3"
            nk: 7
            label: low
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install QuTiP
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'qutip>=5.2,<6'
      - name: Prepare correlated hierarchy, verify stationary state, then quench
        run: python scripts/heom_correlated_quench.py --ratio ${{ matrix.ratio }} --nk ${{ matrix.nk }} --depth 1
      - name: Record measured output
        if: success()
        run: cat outputs/heom_quench/T${{ matrix.ratio }}/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correlated-quench-${{ matrix.label }}
          path: outputs/heom_quench/
          retention-days: 30
          if-no-files-found: warn
      - name: Expose run ID
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 3 --body "Correlated quench ${{ matrix.label }}: [run #${GITHUB_RUN_NUMBER}](${RUN_URL}); run ID \`${GITHUB_RUN_ID}\`; job result **${RESULT}**; commit \`${GITHUB_SHA}\`."
