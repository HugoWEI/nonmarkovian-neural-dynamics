name: Quantum global-goal physicality Pareto (CPU)

on:
  push:
    paths:
      - "scripts/global_norm_pareto.py"
      - "tests/test_global_norm.py"
      - ".github/workflows/global-norm-pareto.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  pareto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Check physicality constraint
        run: python -m pytest -q tests/test_global_norm.py tests/test_goal_error.py
      - name: Run prespecified seven-setting five-seed two-temperature comparison
        run: python scripts/global_norm_pareto.py
      - name: Summarize physical/numerical errors and cost
        if: success()
        run: cat outputs/global_norm_pareto/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-goal-physicality-frontier
          path: outputs/global_norm_pareto/
          retention-days: 30
          if-no-files-found: warn
      - name: Report run ID
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 4 --body "Norm Pareto: [run #${GITHUB_RUN_NUMBER}](${RUN_URL}); run ID \`${GITHUB_RUN_ID}\`; result **${RESULT}**; commit \`${GITHUB_SHA}\`."
