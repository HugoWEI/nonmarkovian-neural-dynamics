name: Interacting omitted-tier memory predictor (CPU)

on:
  push:
    paths:
      - "src/nonmarkovian_neural_dynamics/memory_feedback.py"
      - "scripts/interacting_memory_correction.py"
      - "tests/test_memory_feedback.py"
      - ".github/workflows/interacting-memory-correction.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  memory-correction:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ratio: "3.0"
            nk: 3
            label: high-nk3
          - ratio: "0.3"
            nk: 3
            label: low-nk3
          - ratio: "0.3"
            nk: 7
            label: low-nk7
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'qutip>=5.2,<6'
      - name: Verify first-order block-memory formula
        run: python -m pytest -q tests/test_memory_feedback.py tests/test_hierarchy_defect.py
      - name: Predict interacting non-Markovian error without high-depth adjoint
        run: |
          timeout --signal=TERM --kill-after=20s 420s python scripts/interacting_memory_correction.py \
            --ratio ${{ matrix.ratio }} --nk ${{ matrix.nk }} --high-depth 3 \
            --output outputs/memory_correction/${{ matrix.label }}
      - name: Publish matched-initial-state error comparison
        if: success()
        run: cat outputs/memory_correction/${{ matrix.label }}/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interacting-memory-${{ matrix.label }}
          path: outputs/memory_correction/
          retention-days: 30
          if-no-files-found: warn
      - name: Report run ID
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 5 --body "First-order memory ${{ matrix.label }}: [run #${GITHUB_RUN_NUMBER}](${RUN_URL}); run ID \`${GITHUB_RUN_ID}\`; result **${RESULT}**; commit \`${GITHUB_SHA}\`."
