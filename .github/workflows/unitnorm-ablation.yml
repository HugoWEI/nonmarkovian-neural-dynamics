name: Hard-normalized quantum PINN objective comparison (CPU)

on:
  push:
    paths:
      - "scripts/unitnorm_ablation.py"
      - "tests/test_unitnorm.py"
      - ".github/workflows/unitnorm-ablation.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  unitnorm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Check exact physical norm projection
        run: python -m pytest -q tests/test_unitnorm.py
      - name: Compare exactly normalized and conventional PINNs over five seeds
        run: python scripts/unitnorm_ablation.py
      - name: Show occupation error, physicality and compute cost
        if: success()
        run: cat outputs/unitnorm_ablation/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-normalization-ablation
          path: outputs/unitnorm_ablation/
          retention-days: 30
          if-no-files-found: warn
      - name: Report run ID
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 4 --body "Hard normalization: [run #${GITHUB_RUN_NUMBER}](${RUN_URL}); run ID \`${GITHUB_RUN_ID}\`; result **${RESULT}**; commit \`${GITHUB_SHA}\`."
