name: HEOM hierarchy depth 3 pilot (CPU)

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/heom_single_depth.py"
      - ".github/workflows/heom-depth3-pilot.yml"

permissions:
  contents: read
  issues: write

jobs:
  depth3:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ratio: "3.0"
            nk: 3
            label: high-nk3
          - ratio: "0.3"
            nk: 3
            label: low-nk3
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'qutip>=5.2,<6'
      - name: Compute 5,489-ADO depth-3 hierarchy with short runtime cap
        run: |
          timeout --signal=TERM --kill-after=20s 180s python scripts/heom_single_depth.py \
            --ratio ${{ matrix.ratio }} --nk ${{ matrix.nk }} --depth 3 \
            --output outputs/depth3/${{ matrix.label }}
      - name: Report measured occupation and state physicality
        if: success()
        run: cat outputs/depth3/${{ matrix.label }}/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heom-depth3-${{ matrix.label }}
          path: outputs/depth3/
          retention-days: 30
          if-no-files-found: warn
      - name: Expose run ID
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 3 --body "HEOM depth3 pilot ${{ matrix.label }}: [run #${GITHUB_RUN_NUMBER}](${RUN_URL}); run ID \`${GITHUB_RUN_ID}\`; job result **${RESULT}**; commit \`${GITHUB_SHA}\`."
