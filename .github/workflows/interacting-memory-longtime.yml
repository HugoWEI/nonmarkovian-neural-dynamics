name: Interacting memory feedback long-horizon falsification (CPU)

on:
  push:
    paths:
      - ".github/workflows/interacting-memory-longtime.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  long-memory:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ratio: "3.0"
            nk: 3
            label: high-12ps
          - ratio: "0.3"
            nk: 3
            label: low-nk3-12ps
          - ratio: "0.3"
            nk: 7
            label: low-nk7-12ps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'qutip>=5.2,<6'
      - name: Unit-check block-memory formula
        run: python -m pytest -q tests/test_memory_feedback.py
      - name: Compare first-order correction with withheld 12ps high-depth trajectory
        run: |
          timeout --signal=TERM --kill-after=20s 420s python scripts/interacting_memory_correction.py \
            --ratio ${{ matrix.ratio }} --nk ${{ matrix.nk }} --high-depth 3 \
            --mu 0.05 --horizon 12 --samples 161 \
            --output outputs/memory_longtime/${{ matrix.label }}
      - name: Publish long-time correction error and complete cost
        if: success()
        run: cat outputs/memory_longtime/${{ matrix.label }}/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-longtime-${{ matrix.label }}
          path: outputs/memory_longtime/
          retention-days: 30
          if-no-files-found: warn
      - name: Report run ID
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 5 --body "Memory long-horizon ${{ matrix.label }}: [run #${GITHUB_RUN_NUMBER}](${RUN_URL}); run ID \`${GITHUB_RUN_ID}\`; result **${RESULT}**; commit \`${GITHUB_SHA}\`."
