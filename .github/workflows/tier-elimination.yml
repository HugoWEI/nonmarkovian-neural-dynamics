name: Exact tier elimination and converged low-T reference

on:
  push:
    paths:
      - ".github/workflows/tier-elimination.yml"
      - "src/nonmarkovian_neural_dynamics/tier_elimination.py"
      - "scripts/tier_elimination_convergence.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'qutip>=5.2,<6' matplotlib
      - name: Unit and QuTiP cross-check tests
        run: python -m pytest -q tests/test_tier_elimination.py
      - name: Depth convergence with eliminated correlated steady states
        run: python scripts/tier_elimination_convergence.py
      - name: Figure
        run: python scripts/plot_tier_elimination.py
      - name: Commit the regenerated figure to this branch
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/figures/tier_elimination_convergence.svg
          git diff --cached --quiet || (git commit -m "Regenerate tier-elimination figure from CI run" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tier-elimination-convergence
          path: |
            outputs/tier_elimination_convergence/
            results/figures/tier_elimination_convergence.*
