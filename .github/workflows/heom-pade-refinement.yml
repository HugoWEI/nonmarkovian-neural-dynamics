name: Fixed-depth Padé refinement (CPU)

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/heom_pade_refinement.py"
      - ".github/workflows/heom-pade-refinement.yml"

permissions:
  contents: read
  issues: write

jobs:
  pade-refine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ratio: "3.0"
            label: high
          - ratio: "0.3"
            label: low
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'qutip>=5.2,<6'
      - name: Run sequence of Padé orders at hierarchy depth 2
        run: python scripts/heom_pade_refinement.py --ratio ${{ matrix.ratio }} --depth 2
      - name: Publish Padé difference table
        if: success()
        run: cat outputs/pade_refinement/T${{ matrix.ratio }}/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pade-refinement-${{ matrix.label }}
          path: outputs/pade_refinement/
          retention-days: 30
          if-no-files-found: warn
      - name: Expose run ID
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 3 --body "Padé refinement ${{ matrix.label }}: [run #${GITHUB_RUN_NUMBER}](${RUN_URL}); run ID \`${GITHUB_RUN_ID}\`; job result **${RESULT}**; commit \`${GITHUB_SHA}\`."
