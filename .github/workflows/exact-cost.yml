name: Exact small-fermion solver compute benchmark (CPU)

on:
  push:
    paths:
      - "scripts/benchmark_exact_cost.py"
      - ".github/workflows/exact-cost.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  exact-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Benchmark 200 exact solves
        run: python scripts/benchmark_exact_cost.py
      - name: Show reference solver runtime
        if: success()
        run: cat outputs/exact_cost/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quadratic-exact-cost
          path: outputs/exact_cost/
          retention-days: 30
          if-no-files-found: warn
      - name: Report run ID
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 4 --body "Direct solver cost: [run #${GITHUB_RUN_NUMBER}](${RUN_URL}); run ID \`${GITHUB_RUN_ID}\`; result **${RESULT}**; commit \`${GITHUB_SHA}\`."
