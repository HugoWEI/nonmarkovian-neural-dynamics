name: Interacting low-T correlated HEOM Padé Nk5 pilot

on:
  push:
    paths:
      - ".github/workflows/interacting-low-nk5.yml"
      - "scripts/interacting_onelead_heom.py"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  low-Nk5:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'qutip>=5.2,<6'
      - name: Run interacting correlated low-T Nk=5 depth 2/3
        run: |
          timeout --signal=TERM --kill-after=20s 180s python scripts/interacting_onelead_heom.py \
            --ratio 0.3 --nk 5 --depths 2,3 \
            --output outputs/interacting_low_Nk5
      - name: Show convergence and physicality
        if: success()
        run: cat outputs/interacting_low_Nk5/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interacting-low-Nk5
          path: outputs/interacting_low_Nk5/
          retention-days: 30
          if-no-files-found: warn
      - name: Report run ID
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 5 --body "Low-T interacting Nk5: [run #${GITHUB_RUN_NUMBER}](${RUN_URL}); run ID \`${GITHUB_RUN_ID}\`; result **${RESULT}**; commit \`${GITHUB_SHA}\`."
