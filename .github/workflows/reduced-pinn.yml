name: Reduced fermionic PINN objective comparison (CPU)

on:
  push:
    paths:
      - "scripts/reduced_fermionic_pinn.py"
      - "tests/test_reduced_pinn_physics.py"
      - "tests/test_reduced_pinn_smoke.py"
      - ".github/workflows/reduced-pinn.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compare-objectives:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU numerical and neural frameworks
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Validate discrete fermionic benchmark
        run: python -m pytest -q tests/test_reduced_pinn_physics.py tests/test_reduced_pinn_smoke.py
      - name: Compare uniform, projected, and integrated objectives across 3 seeds x 2 temperatures
        run: python scripts/reduced_fermionic_pinn.py --steps 1200
      - name: Publish measured accuracy and runtime
        if: success()
        run: cat outputs/reduced_pinn/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reduced-fermionic-pinn-baselines
          path: outputs/reduced_pinn/
          retention-days: 30
          if-no-files-found: warn
      - name: Report run ID
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 3 --body "Reduced neural PINN: [run #${GITHUB_RUN_NUMBER}](${RUN_URL}); run ID \`${GITHUB_RUN_ID}\`; job result **${RESULT}**; commit \`${GITHUB_SHA}\`."
