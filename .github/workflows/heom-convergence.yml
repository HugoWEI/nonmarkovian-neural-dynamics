name: HEOM two-axis convergence (CPU)

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/heom_convergence.py"
      - "tests/test_heom_convergence.py"
      - ".github/workflows/heom-convergence.yml"
      - "scripts/fermionic_heom_reference.py"

permissions:
  contents: read
  issues: write

jobs:
  convergence:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ratio: "3.0"
            label: high
          - ratio: "0.3"
            label: low
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install QuTiP and project
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'qutip>=5.2,<6'
      - name: Validate convergence comparison metrics
        run: python -m pytest -q tests/test_heom_convergence.py tests/test_fermionic_heom_reference.py
      - name: Run fixed-depth/fixed-Padé controlled comparison
        run: python scripts/heom_convergence.py --ratio ${{ matrix.ratio }}
      - name: Publish numerical diagnostics
        if: success()
        run: cat outputs/heom_convergence/T${{ matrix.ratio }}/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heom-convergence-${{ matrix.label }}
          path: outputs/heom_convergence/
          retention-days: 30
          if-no-files-found: warn
      - name: Report run ID for connector review
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 3 --body "HEOM convergence ${{ matrix.label }}: [run #${GITHUB_RUN_NUMBER}](${RUN_URL}); run ID \`${GITHUB_RUN_ID}\`; job result **${RESULT}**; commit \`${GITHUB_SHA}\`."
