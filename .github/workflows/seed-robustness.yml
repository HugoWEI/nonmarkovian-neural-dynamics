name: Neural PINN seed robustness (CPU)

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/seed_robustness.py"
      - ".github/workflows/seed-robustness.yml"
      - "scripts/quantum_pinn.py"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Multiple-seed comparison
        run: python scripts/seed_robustness.py --steps 2000
      - name: Report metrics
        if: success()
        run: cat outputs/seed_robustness/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strong-memory-seeds
          path: outputs/seed_robustness
          retention-days: 30
          if-no-files-found: warn
