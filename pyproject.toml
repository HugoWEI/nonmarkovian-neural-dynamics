[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nonmarkovian-neural-dynamics"
version = "0.2.0"
description = "Exact deepest-tier elimination for HEOM steady states, with benchmarks and a converged low-temperature reference"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
heom = ["qutip>=5.2"]
research = ["torch>=2.4", "matplotlib>=3.8", "qutip>=5.2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
